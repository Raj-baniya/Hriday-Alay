{% extends 'myapp/base.html' %}
{% block title %}Cardiac Risk Assessment - Hriday Alay{% endblock %}
{% block content %}
<div class="card card-custom p-4">
    <h3 class="fw-bold mb-3"><i class="fa-solid fa-stethoscope text-danger me-2"></i>Heart Disease Prediction</h3>
    {% if result %}
        <div class="alert {% if result == 'High Risk' %}alert-danger{% else %}alert-success{% endif %} text-center">
            <h3>Result: {{ result }}</h3>
            <p class="fs-5 mb-0">Risk Probability: <strong>{{ probability }}%</strong></p>
        </div>
    {% endif %}
    <form method="POST" class="row g-3">
        {% csrf_token %}
        <div class="col-md-4"><label class="form-label">Age</label><input type="number" name="age" class="form-control" required value="{{ form.age.value|default:'' }}"></div>
        <div class="col-md-4"><label class="form-label">Sex</label><select name="sex" class="form-select"><option value="1">Male</option><option value="0">Female</option></select></div>
        <div class="col-md-4"><label class="form-label">Chest Pain Type</label><select name="cp" class="form-select"><option value="0">Typical Angina (0)</option><option value="1">Atypical (1)</option><option value="2">Non-anginal (2)</option><option value="3">Asymptomatic (3)</option></select></div>
        <div class="col-md-4"><label class="form-label">Resting BP (mm Hg)</label><input type="number" name="trestbps" class="form-control" required value="{{ form.trestbps.value|default:'' }}"></div>
        <div class="col-md-4"><label class="form-label">Cholesterol (mg/dl)</label><input type="number" name="chol" class="form-control" required value="{{ form.chol.value|default:'' }}"></div>
        <div class="col-md-4"><label class="form-label">Fasting Blood Sugar</label><select name="fbs" class="form-select"><option value="0">&le; 120 mg/dl</option><option value="1">&gt; 120 mg/dl</option></select></div>
        <div class="col-md-4"><label class="form-label">Resting ECG</label><select name="restecg" class="form-select"><option value="0">Normal (0)</option><option value="1">ST-T Wave (1)</option><option value="2">LV Hypertrophy (2)</option></select></div>
        <div class="col-md-4"><label class="form-label">Max Heart Rate</label><input type="number" name="thalach" class="form-control" required value="{{ form.thalach.value|default:'' }}"></div>
        <div class="col-md-4"><label class="form-label">Exercise Angina</label><select name="exang" class="form-select"><option value="0">No (0)</option><option value="1">Yes (1)</option></select></div>
        <div class="col-md-4"><label class="form-label">ST Depression</label><input type="number" step="0.1" name="oldpeak" class="form-control" required value="{{ form.oldpeak.value|default:'' }}"></div>
        <div class="col-md-4"><label class="form-label">ST Slope</label><select name="slope" class="form-select"><option value="0">Upsloping (0)</option><option value="1">Flat (1)</option><option value="2">Downsloping (2)</option></select></div>
        <div class="col-md-4"><label class="form-label">Major Vessels</label><select name="ca" class="form-select"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
        <div class="col-md-4"><label class="form-label">Thalassemia</label><select name="thal" class="form-select"><option value="1">Normal</option><option value="2">Fixed Defect</option><option value="3">Reversible</option></select></div>
        <div class="col-12 mt-3 text-end"><button type="submit" class="btn btn-cardio px-5">Compute Risk</button></div>
    </form>
</div>
{% endblock %}
