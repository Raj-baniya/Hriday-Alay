{% extends 'myapp/base.html' %}
{% block title %}Patient Search - Hriday Alay{% endblock %}
{% block content %}
<div class="card card-custom p-4">
    <h3 class="fw-bold mb-3">Patient Lookup</h3>
    <form method="GET" action="{% url 'patient_search' %}" class="row g-2 mb-4">
        <div class="col-md-9"><input type="text" name="q" class="form-control" placeholder="Patient username" value="{{ search_query }}"></div>
        <div class="col-md-3"><button type="submit" class="btn btn-cardio w-100">Search</button></div>
    </form>
    {% if error_message %}<div class="alert alert-warning">{{ error_message }}</div>{% endif %}
    {% if patient %}<div class="alert alert-info">Found Patient: {{ patient.user.username }}</div>{% endif %}
</div>
{% endblock %}
