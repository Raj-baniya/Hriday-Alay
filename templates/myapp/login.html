{% extends 'myapp/base.html' %}
{% block title %}Login - Hriday Alay{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card card-custom p-4">
    <h3 class="fw-bold text-center mb-4">Sign In</h3>
    <form method="POST">{% csrf_token %}
        <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" required></div>
        <div class="mb-4"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn btn-cardio w-100">Sign In</button>
    </form>
</div></div></div>
{% endblock %}
